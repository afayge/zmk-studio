name: Desktop packages

on:
  workflow_dispatch:
  push:
    branches: ['release/v*-afayge.*']
    tags: ['v*-afayge.*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS-universal
            args: --target universal-apple-darwin --bundles dmg
          - os: windows-2022
            platform: Windows-x64
            args: --bundles nsis
          - os: ubuntu-24.04
            platform: Linux-x64
            args: --bundles appimage,deb
          - os: ubuntu-24.04-arm
            platform: Linux-arm64
            args: --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev libdbus-1-dev libssl-dev patchelf file xdg-utils
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build installers
        run: npm run tauri -- build ${{ matrix.args }} -- --locked
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - name: Verify and collect native packages
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash scripts/verify-packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Upload packages and verify the draft downloads
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -eu
          TAG=${RELEASE_REF#release/}
          test -f "../.github/release-notes/$TAG.md"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          test "$(find . -maxdepth 1 -name 'ZMK-Studio-*' -type f | wc -l)" -eq 6
          sha256sum ZMK-Studio-* > SHA256SUMS.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft -q .isDraft)" = true
          else
            gh release create "$TAG" --draft --verify-tag --title "ZMK Studio $TAG" --notes-file "../.github/release-notes/$TAG.md"
          fi
          gh release upload "$TAG" ZMK-Studio-* SHA256SUMS.txt --clobber
          gh release download "$TAG" --dir "$RUNNER_TEMP/verify-assets"
          cd "$RUNNER_TEMP/verify-assets"
          cmp SHA256SUMS.txt "$GITHUB_WORKSPACE/release-assets/SHA256SUMS.txt"
          sha256sum --strict -c SHA256SUMS.txt
          gh release edit "$TAG" --draft=false --latest
